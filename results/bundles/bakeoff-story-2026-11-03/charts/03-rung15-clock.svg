</style><rect width="1600" height="676" style="fill:var(--surface)"/><text x="60" y="64" font-size="34" font-weight="600">Rung 15 was a coin flip: the grader&#x27;s clock, not the model</text><text x="60" y="98" font-size="20" class="t2">deepseek&#x27;s third climb missed with code byte-identical to its two passes</text><text x="380" y="136" font-size="18" class="t2">Hidden suite wall seconds under the first two-process grader (hash c5d2); the call's own budget is 2.0 s</text><line x1="817.5" y1="152" x2="817.5" y2="544" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="6 6"/><text x="825.5" y="158" font-size="15" class="t2">2.0 s budget</text><text x="366" y="177.0" font-size="18" text-anchor="end">glm, climb 1</text><path d="M380.0,160.0 h500.4 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-500.4 z" class="bar"/><text x="892.4375" y="177.0" font-size="16" class="t2">2.31 s</text><text x="366" y="233.0" font-size="18" text-anchor="end">glm, climb 2</text><path d="M380.0,216.0 h430.0 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-430.0 z" class="bar"/><text x="822.0" y="233.0" font-size="16" class="t2">1.98 s</text><text x="366" y="289.0" font-size="18" text-anchor="end">glm, climb 3</text><path d="M380.0,272.0 h467.6 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-467.6 z" class="bar"/><text x="859.625" y="289.0" font-size="16" class="t2">2.16 s</text><text x="366" y="345.0" font-size="18" text-anchor="end">deepseek, climb 1</text><path d="M380.0,328.0 h521.2 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-521.2 z" class="bar"/><text x="913.2187499999999" y="345.0" font-size="16" class="t2">2.40 s</text><text x="366" y="401.0" font-size="18" text-anchor="end">deepseek, climb 2</text><path d="M380.0,384.0 h447.5 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-447.5 z" class="bar"/><text x="839.5" y="401.0" font-size="16" class="t2">2.06 s</text><text x="366" y="457.0" font-size="18" text-anchor="end">deepseek, climb 3</text><path d="M380.0,440.0 h599.3 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-599.3 z" class="crit"/><text x="991.3124999999999" y="457.0" font-size="16" class="t2">2.76 s   ✕ MISS: the timed call alone read 2.20 s</text><text x="366" y="513.0" font-size="18" text-anchor="end">gold fix, --mock gold</text><path d="M380.0,496.0 h453.8 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-453.8 z" class="bar"/><text x="845.84375" y="513.0" font-size="16" class="t2">2.09 s</text><text x="366" y="593.0" font-size="18" text-anchor="end" font-weight="600">gold fix, clock inside the worker</text><path d="M380.0,576.0 h47.2 a4,4 0 0 1 4,4 v14.0 a4,4 0 0 1 -4,4 h-47.2 z" class="bar"/><text x="439.1875" y="593.0" font-size="16" class="t2">0.23 s   (hash 1173, the fix: ladder_clock.last_call_seconds)</text><text x="60" y="654" font-size="15" class="t2">All seven c5d2 bars ran the same sort-and-bisect fix. The wall clock in the assertion process was counting the JSON proxy on two 100k-entry lists, not the submission.</text></svg>